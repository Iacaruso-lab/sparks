[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparks-ai"
dynamic = ["version"]
authors = [
  { name="Nicolas Skatchkovsky", email="nicolas.skatchkovsky@crick.ac.uk" },
]

keywords = ["Computational neuroscience", "Artificial Intelligence", "GenAI"]
description = "Sequential Predictive Autoencoder for the Representation of spiKing Signals"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
classifiers = ["Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["torch>=2.4",
    "numpy",
    "scipy",
    "scikit-learn"]

[project.optional-dependencies]
# Allen Brain Observatory loaders and preprocessing (sparks.data.allen)
allen = ["allensdk", "tqdm"]
# Neural Latents Benchmark loaders (sparks.data.nlb)
nlb = ["pynwb", "pandas"]
# Allen calcium-imaging movies dataset, fetched through CEBRA (sparks.data.allen.datasets.AllenMoviesCaDataset)
cebra = ["cebra"]
all = ["sparks-ai[allen,nlb,cebra]"]
demos = ["jupyter", "matplotlib", "tqdm"]
dev = ["pytest", "ruff", "pre-commit", "build", "twine", "tqdm"]
# MambaBlock needs mamba-ssm, which has no extra here: it must be built against the installed torch
# and CUDA, i.e. `pip install causal-conv1d mamba-ssm --no-build-isolation`.

[project.urls]
Homepage = "https://github.com/Iacaruso-lab/sparks"
Documentation = "https://sparks.crick.ac.uk/"
Issues = "https://github.com/Iacaruso-lab/sparks/issues"

[tool.setuptools.dynamic]
version = {attr = "sparks.__version__"}

[tool.setuptools.packages.find]
include = ["sparks*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets test modules import the shared tests/helpers.py
addopts = "-ra --strict-markers"
xfail_strict = true  # a known-bug test that starts passing must have its xfail marker removed

[tool.ruff]
extend-exclude = ["sparks/data/nlb/nwb_interface.py"]  # vendored from nlb_tools, kept as upstream

[tool.ruff.lint]
select = ["F"]  # pyflakes: unused imports and variables, undefined names, ...
